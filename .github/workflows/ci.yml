name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-shadow:
    name: Build, test, Shadow CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ARC.sln

      - name: Build
        run: dotnet build ARC.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ARC.sln --no-build --configuration Release --verbosity minimal --filter FullyQualifiedName!~ARC.Integration.Tests

      - name: Shadow CLI (S1–S9)
        run: dotnet run --project src/ARC.Cli --no-build --configuration Release -- all
